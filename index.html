
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawab Saheb — Fine Mughlai Dining | The Westin Mumbai Powai Lake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              charcoal: '#1A1A1A',
              'charcoal-light': '#262626',
              gold: '#C9A227',
              'gold-light': '#E8D5A3',
              cream: '#FDF8F3',
            },
            fontFamily: {
              display: ['Playfair Display', 'serif'],
              body: ['Inter', 'sans-serif'],
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
              'spin-reverse': 'spin-reverse 25s linear infinite',
              'steam': 'steam 2s ease-in-out infinite',
              'fade-in': 'fadeIn 1s ease-out forwards',
              'slide-up': 'slideUp 0.8s ease-out forwards',
            },
            keyframes: {
              'spin-reverse': {
                from: { transform: 'rotate(360deg)' },
                to: { transform: 'rotate(0deg)' }
              },
              steam: {
                '0%, 100%': { opacity: '0', transform: 'translateY(0) scaleY(1)' },
                '50%': { opacity: '0.8', transform: 'translateY(-20px) scaleY(1.5)' }
              },
              fadeIn: {
                from: { opacity: '0' },
                to: { opacity: '1' }
              },
              slideUp: {
                from: { opacity: '0', transform: 'translateY(30px)' },
                to: { opacity: '1', transform: 'translateY(0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #1A1A1A; }
      ::-webkit-scrollbar-thumb { background: #C9A227; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #E8D5A3; }
      body { background-color: #1A1A1A; color: #FDF8F3; font-family: 'Inter', sans-serif; }
    </style>
